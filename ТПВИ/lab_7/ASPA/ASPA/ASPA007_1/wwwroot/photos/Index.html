<!-- ASPA006_1/wwwroot/Index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>ASPA006_1 – Life Events of Celebrities</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #photos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .photo-item {
            cursor: pointer;
            text-align: center;
        }

            .photo-item img {
                max-width: 150px;
                border: 1px solid #ccc;
                display: block;
                margin-bottom: 5px;
            }

        #events {
            margin-top: 20px;
        }

            #events table {
                border-collapse: collapse;
                width: 100%;
            }

            #events th, #events td {
                border: 1px solid #ccc;
                padding: 5px;
            }
    </style>
</head>
<body>
    <h1>Life Events of Celebrities</h1>
    <div id="photos"></div>
    <div id="events">
        <h2>События</h2>
        <table>
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Описание</th>
                </tr>
            </thead>
            <tbody id="events-body"></tbody>
        </table>
    </div>

    <script>
        async function loadCelebrities() {
            const res = await fetch('/api/celebrities');
            const data = await res.json();
            const container = document.getElementById('photos');
            container.innerHTML = '';
            data.forEach(c => {
                const div = document.createElement('div');
                div.className = 'photo-item';
                const img = document.createElement('img');
                img.src = c.reqPhotoPath || '';
                img.alt = c.fullName;
                img.onclick = () => loadEvents(c.id);
                div.appendChild(img);
                const caption = document.createElement('div');
                caption.textContent = c.fullName;
                div.appendChild(caption);
                container.appendChild(div);
            });
        }

        async function loadEvents(celebrityId) {
            const res = await fetch(`/api/celebrities/${celebrityId}/lifeevents`);
            const data = await res.json();
            const tbody = document.getElementById('events-body');
            tbody.innerHTML = '';
            data.forEach(e => {
                const tr = document.createElement('tr');
                const tdDate = document.createElement('td');
                tdDate.textContent = e.date ? new Date(e.date).toLocaleDateString() : '';
                const tdDesc = document.createElement('td');
                tdDesc.textContent = e.description;
                tr.appendChild(tdDate);
                tr.appendChild(tdDesc);
                tbody.appendChild(tr);
            });
        }

        loadCelebrities();
    </script>
</body>
</html>
